# Verification runner mapping for LUM-MCU1 make entry points.
# Declares which container must execute each gate command.
#   hdl_sim  -> verilator runner (verilator, iverilog, cocotb, peakrdl)
#   hdl_synth -> yosys runner (yosys)
#
# make lint MUST run on hdl_sim: Verilator is a stub (exit 78) in the yosys runner.
version: 1
commands:
  - command: make lint
    toolchain: hdl_sim
  - command: make sim
    toolchain: hdl_sim
  - command: make synth
    toolchain: hdl_synth
